name: ai-schedule-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_schedule_test
      POSTGRES_USER: ai_schedule_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ai_schedule_test -d ai_schedule_test]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database

  migrate:
    image: ai-schedule-test-server:${RELEASE_TAG:?RELEASE_TAG is required}
    command: [corepack, pnpm, --filter, '@ai-schedule/db', db:migrate:deploy]
    environment:
      DATABASE_URL: postgresql://ai_schedule_test:${POSTGRES_PASSWORD}@postgres:5432/ai_schedule_test
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    restart: 'no'

  server:
    image: ai-schedule-test-server:${RELEASE_TAG:?RELEASE_TAG is required}
    environment:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://ai_schedule_test:${POSTGRES_PASSWORD}@postgres:5432/ai_schedule_test
      ALLOWED_ORIGINS: http://1.14.150.18
      AGENT_SERVICE_URL: http://agent:8081
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?AGENT_SERVICE_TOKEN is required}
      AGENT_CONTEXT_SERVICE_TOKEN: ${AGENT_CONTEXT_SERVICE_TOKEN:?AGENT_CONTEXT_SERVICE_TOKEN is required}
      TRUSTED_PROXY_ADDRESSES: 127.0.0.1,::1
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - database
      - inference
      - public

  agent:
    image: ai-schedule-test-agent:${RELEASE_TAG:?RELEASE_TAG is required}
    environment:
      AGENT_ENV: production
      AGENT_MAX_BODY_BYTES: 262144
      AGENT_MAX_CONCURRENCY: 4
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?AGENT_SERVICE_TOKEN is required}
      AGENT_CONTEXT_SERVICE_TOKEN: ${AGENT_CONTEXT_SERVICE_TOKEN:?AGENT_CONTEXT_SERVICE_TOKEN is required}
      AGENT_CONTEXT_URL: http://server:3000
      AI_SCHEDULE_CONFIG_ROOT: /app/config
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/internal/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - inference
    logging:
      driver: none

  web:
    image: ai-schedule-test-web:${RELEASE_TAG:?RELEASE_TAG is required}
    ports:
      - 127.0.0.1:18080:8080
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - public

volumes:
  postgres_data:

networks:
  database:
    internal: true
  inference:
  public:
