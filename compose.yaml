services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_schedule
      POSTGRES_USER: ai_schedule
      POSTGRES_PASSWORD: ai_schedule
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_schedule -d ai_schedule"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - ai_schedule_postgres:/var/lib/postgresql/data

volumes:
  ai_schedule_postgres:
