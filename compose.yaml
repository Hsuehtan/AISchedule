services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_schedule
      POSTGRES_USER: ai_schedule
      POSTGRES_PASSWORD: ai_schedule
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ai_schedule -d ai_schedule']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - ai_schedule_postgres:/var/lib/postgresql/data
    networks:
      - database_internal

  agent-service:
    build:
      context: .
      dockerfile: apps/agent-service/Dockerfile
    environment:
      AGENT_ENV: production
      AGENT_MAX_BODY_BYTES: 262144
      AGENT_MAX_CONCURRENCY: 4
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?AGENT_SERVICE_TOKEN is required}
      AGENT_CONTEXT_SERVICE_TOKEN: ${AGENT_CONTEXT_SERVICE_TOKEN:?AGENT_CONTEXT_SERVICE_TOKEN is required}
      AGENT_CONTEXT_URL: ${AGENT_CONTEXT_URL:-http://host.docker.internal:3000}
      AI_SCHEDULE_CONFIG_ROOT: /app/config
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    ports:
      - '127.0.0.1:${AGENT_SERVICE_PORT:-8081}:8081'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8081/internal/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    networks:
      - agent_internal
    logging:
      driver: none

volumes:
  ai_schedule_postgres:

networks:
  database_internal:
  agent_internal:
