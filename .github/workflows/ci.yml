name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable pnpm 11
        run: corepack enable

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up uv and Python 3.11.15
        uses: astral-sh/setup-uv@v8
        with:
          version: '0.11.23'
          python-version: '3.11.15'
          working-directory: apps/agent-service
          enable-cache: true

      - name: Install Python dependencies
        working-directory: apps/agent-service
        run: uv sync --locked

      - name: Check generated internal Agent contract
        run: pnpm agent:contract:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
